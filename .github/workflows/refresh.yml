name: refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python radar.py
      - name: Commit feed
        run: |
          git config user.name  "agent-bounty-radar[bot]"
          git config user.email "agent-bounty-radar@users.noreply.github.com"
          git add README.md data/bounties.json
          git diff --cached --quiet || git commit -m "chore: refresh $(date -u +%FT%TZ)"
          git push
